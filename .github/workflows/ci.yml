name: Quality Gate
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run smoke
      - run: npm run validate:collection
      - run: npm run validate:ui
      - run: npm run balance
      - run: node --check public/app.js && node --check public/engine.js && node --check public/aaa-enhancements.js && node --check server/index.js && node --check scripts/import-chimpions.js && node --check scripts/validate-collection.js && node --check scripts/validate-ui-assets.js && node --check scripts/balance-report.js
