name: Import Full Chimpions Collection

on:
  push:
    branches:
      - work/import-full-collection

permissions:
  contents: write

jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message, '[collection snapshot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Import official collection snapshot
        run: ALLOW_PARTIAL_IMPORT=1 npm run import
      - name: Validate available cards
        run: npm run validate:collection
      - name: Check advertised completeness
        continue-on-error: true
        run: npm run validate:collection:strict
      - name: Generate balance report
        run: |
          mkdir -p reports
          node scripts/balance-report.js > reports/balance-report.json
      - name: Commit generated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/chimpions.json reports/balance-report.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh official collection snapshot [collection snapshot]"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: chimpions-full-collection
          path: |
            public/data/chimpions.json
            reports/balance-report.json
