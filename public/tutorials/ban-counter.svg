<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc"><title id="title">Ban &amp; Counter — How it works</title><desc id="desc">Five-step Ban and Counter mode tutorial for Chimpions Arena.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04152d"/><stop offset=".55" stop-color="#081127"/><stop offset="1" stop-color="#220721"/></linearGradient><linearGradient id="titleG" x1="0" x2="1"><stop stop-color="#5beeff"/><stop offset=".48" stop-color="#fff"/><stop offset=".52" stop-color="#ff7cd8"/><stop offset="1" stop-color="#ff2f9e"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#53bfff" stroke-opacity=".055"/></pattern><symbol id="blue" viewBox="0 0 120 120"><path d="M22 41 38 12l20 20 18-18 21 28" fill="#9d512b" stroke="#20d8ff" stroke-width="7"/><circle cx="60" cy="70" r="35" fill="#b56637" stroke="#20d8ff" stroke-width="7"/><path d="M26 52h68v17H26z" fill="#168cff"/><path d="M43 78h34l-6 18H49z" fill="#e6ae77"/><circle cx="47" cy="64" r="5"/><circle cx="73" cy="64" r="5"/></symbol><symbol id="pink" viewBox="0 0 120 120"><path d="M20 35 40 11l20 20 18-16 20 26" fill="#9d512b"/><circle cx="60" cy="70" r="35" fill="#b56637" stroke="#ff43c8" stroke-width="7"/><path d="M26 48h68v20H26z" fill="#ff31ac"/><path d="M43 78h34l-6 18H49z" fill="#e6ae77"/><circle cx="47" cy="64" r="5"/><circle cx="73" cy="64" r="5"/></symbol><symbol id="cardB" viewBox="0 0 180 250"><rect x="3" y="3" width="174" height="244" rx="16" fill="#061a34" stroke="#27e2ff" stroke-width="6"/><use href="#blue" x="37" y="8" width="106" height="106"/><g font-family="Arial,sans-serif" font-weight="800" font-size="15" fill="#fff"><text x="15" y="139">PWR</text><text x="140" y="139">82</text><text x="15" y="164">SPD</text><text x="140" y="164">71</text><text x="15" y="189">SKL</text><text x="140" y="189">68</text><text x="15" y="214">LCK</text><text x="140" y="214">54</text><text x="15" y="239">MYS</text><text x="140" y="239">70</text></g></symbol><symbol id="cardP" viewBox="0 0 180 250"><rect x="3" y="3" width="174" height="244" rx="16" fill="#271029" stroke="#ff46c9" stroke-width="6"/><use href="#pink" x="37" y="8" width="106" height="106"/><g font-family="Arial,sans-serif" font-weight="800" font-size="15" fill="#fff"><text x="15" y="139">PWR</text><text x="140" y="139">88</text><text x="15" y="164">SPD</text><text x="140" y="164">60</text><text x="15" y="189">SKL</text><text x="140" y="189">74</text><text x="15" y="214">LCK</text><text x="140" y="214">62</text><text x="15" y="239">MYS</text><text x="140" y="239">76</text></g></symbol></defs><rect width="1254" height="1254" fill="url(#bg)"/><rect width="1254" height="1254" fill="url(#grid)"/><use href="#blue" x="45" y="12" width="218" height="218"/><use href="#pink" x="992" y="12" width="218" height="218"/><text x="627" y="120" text-anchor="middle" font-family="Courier New,monospace" font-weight="900" font-size="104" fill="url(#titleG)" stroke="#03101f" stroke-width="8" paint-order="stroke">BAN &amp; COUNTER</text><rect x="421" y="145" width="412" height="66" rx="10" fill="#0b1830" stroke="#29dfff" stroke-width="4"/><text x="627" y="191" text-anchor="middle" font-family="Courier New,monospace" font-weight="900" font-size="38" fill="#fff">HOW IT WORKS</text><g font-family="Courier New,monospace"><rect x="18" y="235" width="392" height="435" rx="18" fill="#06172f" stroke="#2be2ff" stroke-width="6"/><rect x="431" y="235" width="392" height="435" rx="18" fill="#07162e" stroke="#2be2ff" stroke-width="6"/><rect x="844" y="235" width="392" height="435" rx="18" fill="#0d132d" stroke="#2be2ff" stroke-width="6"/><g font-weight="900" fill="#fff"><text x="42" y="290" fill="#67edff" font-size="48">1</text><text x="104" y="290" font-size="27">DEFENDER BANS 1 STAT</text><text x="455" y="290" fill="#67edff" font-size="48">2</text><text x="516" y="290" font-size="28">THAT STAT IS LOCKED</text><text x="868" y="290" fill="#67edff" font-size="48">3</text><text x="930" y="290" font-size="27">CHOOSE FROM OTHER 5</text></g><use href="#cardB" x="120" y="322" width="190" height="264"/><rect x="133" y="481" width="164" height="29" fill="#4f0c23" stroke="#ff4369" stroke-width="4"/><text x="215" y="503" text-anchor="middle" font-size="17" fill="#fff" font-weight="900">MYSTIQUE ⊘</text><use href="#pink" x="300" y="395" width="90" height="90"/><rect x="283" y="345" width="105" height="48" rx="9" fill="#fff" stroke="#ff43b4" stroke-width="5"/><text x="335" y="378" text-anchor="middle" fill="#e71c6c" font-weight="900" font-size="27">BAN!</text><text x="65" y="642" fill="#fff" font-size="22" font-weight="700">Before the duel, defender bans 1 attribute.</text><use href="#cardB" x="466" y="330" width="155" height="216"/><use href="#cardP" x="635" y="330" width="155" height="216"/><circle cx="627" cy="450" r="52" fill="#4d0714" stroke="#ff3148" stroke-width="7"/><text x="627" y="470" text-anchor="middle" font-size="61" fill="#ff5264" font-weight="900">⊘</text><text x="469" y="642" fill="#fff" font-size="22" font-weight="700">The banned stat cannot be used this round.</text><use href="#cardB" x="945" y="320" width="190" height="264"/><rect x="958" y="443" width="164" height="27" fill="#0c2534" stroke="#ffe63d" stroke-width="4"/><text x="1040" y="464" text-anchor="middle" fill="#fff" font-size="17" font-weight="900">SPD 71</text><text x="872" y="642" fill="#fff" font-size="22" font-weight="700">Chooser attacks with one remaining stat.</text><rect x="18" y="691" width="598" height="410" rx="18" fill="#06172f" stroke="#2be2ff" stroke-width="6"/><rect x="638" y="691" width="598" height="410" rx="18" fill="#100d29" stroke="#2be2ff" stroke-width="6"/><text x="42" y="750" fill="#67edff" font-weight="900" font-size="48">4</text><text x="104" y="750" fill="#fff" font-weight="900" font-size="33">COMPARE THE CARDS</text><use href="#cardB" x="102" y="780" width="190" height="264"/><use href="#cardP" x="338" y="780" width="190" height="264"/><text x="317" y="920" text-anchor="middle" fill="#fff" stroke="#061020" stroke-width="8" paint-order="stroke" font-size="55" font-weight="900">VS</text><text x="106" y="1080" fill="#fff" font-size="22" font-weight="700">The chosen stat decides the duel.</text><text x="662" y="750" fill="#67edff" font-weight="900" font-size="48">5</text><text x="724" y="750" fill="#fff" font-weight="900" font-size="31">WINNER CAPTURES BOTH</text><use href="#blue" x="690" y="794" width="150" height="150"/><g transform="translate(856 820) rotate(-9)"><rect width="112" height="165" rx="12" fill="#087eb9" stroke="#66efff" stroke-width="5"/><text x="56" y="100" text-anchor="middle" font-size="55">♛</text></g><g transform="translate(956 826) rotate(9)"><rect width="112" height="165" rx="12" fill="#b3167c" stroke="#ff72d2" stroke-width="5"/><text x="56" y="100" text-anchor="middle" font-size="55">♛</text></g><text x="1090" y="838" fill="#ffe850" font-weight="900" font-size="52" filter="url(#glow)">WIN!</text><text x="705" y="1080" fill="#fff" font-size="22" font-weight="700">Higher value wins and captures both cards.</text></g><rect x="18" y="1123" width="1218" height="98" rx="15" fill="#071329" stroke="#328cc2" stroke-width="3"/><text x="627" y="1188" text-anchor="middle" font-family="Courier New,monospace" font-weight="900" font-size="43" fill="#fff">CHIMPIONS <tspan fill="#ff59c9">ARENA</tspan></text><text x="50" y="1183" font-family="Courier New,monospace" font-size="17" fill="#74ecff">SKILL WINS. SMARTER PLAYS.</text><text x="1204" y="1183" text-anchor="end" font-family="Courier New,monospace" font-size="17" fill="#ff84d5">SAME CARDS. NEW STRATEGIES.</text></svg>