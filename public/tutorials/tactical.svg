<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
<title id="title">Tactical — How it works</title><desc id="desc">Five-step Tactical mode tutorial for Chimpions Arena.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061126"/><stop offset=".5" stop-color="#07142b"/><stop offset="1" stop-color="#160725"/></linearGradient>
 <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#16d9ff"/><stop offset=".5" stop-color="#eefcff"/><stop offset="1" stop-color="#39a8ff"/></linearGradient>
 <linearGradient id="pink" x1="0" x2="1"><stop stop-color="#ff45d7"/><stop offset=".55" stop-color="#fff3fb"/><stop offset="1" stop-color="#ff279b"/></linearGradient>
 <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#ffef77"/><stop offset="1" stop-color="#ff9f1c"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#48aaff" stroke-opacity=".055"/></pattern>
 <symbol id="chimpBlue" viewBox="0 0 120 120"><path d="M23 39 37 14l18 18 18-22 21 27" fill="#b15b2c" stroke="#2ad7ff" stroke-width="7" stroke-linejoin="round"/><circle cx="60" cy="68" r="36" fill="#b76634" stroke="#2ad7ff" stroke-width="7"/><circle cx="25" cy="69" r="12" fill="#c87844"/><circle cx="95" cy="69" r="12" fill="#c87844"/><path d="M29 56h62" stroke="#1b89ff" stroke-width="14"/><path d="M43 76h34l-5 20H48z" fill="#e2aa72"/><circle cx="47" cy="64" r="5"/><circle cx="73" cy="64" r="5"/></symbol>
 <symbol id="chimpPink" viewBox="0 0 120 120"><path d="M25 32 40 12l18 18 18-17 20 24" fill="#b15b2c"/><circle cx="60" cy="68" r="36" fill="#b76634" stroke="#ff42cf" stroke-width="7"/><circle cx="25" cy="69" r="12" fill="#c87844"/><circle cx="95" cy="69" r="12" fill="#c87844"/><path d="M29 52h62v16H29z" fill="#ff32ba"/><path d="M43 76h34l-5 20H48z" fill="#e2aa72"/><circle cx="47" cy="64" r="5"/><circle cx="73" cy="64" r="5"/></symbol>
 <symbol id="cardB" viewBox="0 0 190 260"><rect x="3" y="3" width="184" height="254" rx="18" fill="#07172d" stroke="#2be4ff" stroke-width="6"/><use href="#chimpBlue" x="38" y="10" width="115" height="115"/><g fill="#e8f8ff" font-family="Arial,sans-serif" font-weight="800" font-size="15"><text x="18" y="145">PWR</text><text x="148" y="145">82</text><text x="18" y="168">AGI</text><text x="148" y="168">71</text><text x="18" y="191">INT</text><text x="148" y="191">68</text><text x="18" y="214">TEC</text><text x="148" y="214">54</text><text x="18" y="237">MYS</text><text x="148" y="237">70</text></g><path d="M12 154h166M12 177h166M12 200h166M12 223h166" stroke="#278fc0" opacity=".7"/></symbol>
 <symbol id="cardP" viewBox="0 0 190 260"><rect x="3" y="3" width="184" height="254" rx="18" fill="#21102a" stroke="#ff3ec9" stroke-width="6"/><use href="#chimpPink" x="38" y="10" width="115" height="115"/><g fill="#fff2fb" font-family="Arial,sans-serif" font-weight="800" font-size="15"><text x="18" y="145">PWR</text><text x="148" y="145">88</text><text x="18" y="168">AGI</text><text x="148" y="168">60</text><text x="18" y="191">INT</text><text x="148" y="191">74</text><text x="18" y="214">TEC</text><text x="148" y="214">62</text><text x="18" y="237">MYS</text><text x="148" y="237">76</text></g><path d="M12 154h166M12 177h166M12 200h166M12 223h166" stroke="#b53a92" opacity=".7"/></symbol>
</defs>
<rect width="1254" height="1254" fill="url(#bg)"/><rect width="1254" height="1254" fill="url(#grid)"/><path d="M0 0h540L410 118H0z" fill="#0067ff" opacity=".13"/><path d="M1254 0H714l130 118h410z" fill="#ff149e" opacity=".13"/>
<use href="#chimpBlue" x="54" y="13" width="220" height="220"/><use href="#chimpPink" x="980" y="13" width="220" height="220"/>
<text x="627" y="126" text-anchor="middle" font-family="Courier New,monospace" font-weight="900" font-size="118" fill="url(#cyan)" stroke="#041022" stroke-width="8" paint-order="stroke">TACTICAL</text>
<rect x="417" y="147" width="420" height="66" rx="10" fill="#0a1830" stroke="#28dcff" stroke-width="4"/><text x="627" y="194" text-anchor="middle" font-family="Courier New,monospace" font-size="38" font-weight="900" fill="#fff">HOW IT WORKS</text>
<!-- top panels -->
<g font-family="Courier New,monospace"><rect x="18" y="235" width="392" height="445" rx="18" fill="#07162d" stroke="#25ddff" stroke-width="6"/><rect x="431" y="235" width="392" height="445" rx="18" fill="#07162d" stroke="#25ddff" stroke-width="6"/><rect x="844" y="235" width="392" height="445" rx="18" fill="#0c132d" stroke="#25ddff" stroke-width="6"/>
<g fill="#fff" font-weight="900"><text x="42" y="292" font-size="48" fill="#69eeff">1</text><text x="105" y="292" font-size="31">CHOOSE 1 STAT</text><text x="455" y="292" font-size="48" fill="#69eeff">2</text><text x="518" y="292" font-size="31">COMPARE CARDS</text><text x="868" y="292" font-size="48" fill="#69eeff">3</text><text x="930" y="292" font-size="27">WINNER CAPTURES</text></g>
<use href="#cardB" x="100" y="320" width="225" height="305"/><rect x="113" y="493" width="198" height="28" rx="5" fill="#14151d" stroke="#ffdd35" stroke-width="4"/><text x="76" y="654" fill="#fff" font-size="24" font-weight="700">Pick 1 attribute from your front card.</text>
<use href="#cardB" x="452" y="336" width="174" height="238"/><use href="#cardP" x="629" y="336" width="174" height="238"/><text x="627" y="463" text-anchor="middle" fill="#fff" stroke="#061020" stroke-width="8" paint-order="stroke" font-size="51" font-weight="900">VS</text><text x="476" y="654" fill="#fff" font-size="24" font-weight="700">The chosen stat decides the duel.</text>
<use href="#chimpBlue" x="875" y="328" width="135" height="135"/><g transform="translate(972 352) rotate(-11)"><rect width="100" height="150" rx="10" fill="#0877b8" stroke="#7ff5ff" stroke-width="5"/><path d="M22 38h56v73H22z" fill="#13b9ee"/><text x="50" y="94" text-anchor="middle" font-size="49">♛</text></g><g transform="translate(1056 362) rotate(11)"><rect width="100" height="150" rx="10" fill="#a51275" stroke="#ff88de" stroke-width="5"/><path d="M22 38h56v73H22z" fill="#e329a7"/><text x="50" y="94" text-anchor="middle" font-size="49">♛</text></g><text x="1036" y="540" text-anchor="middle" font-size="58" font-weight="900" fill="url(#gold)" filter="url(#glow)">WIN!</text><text x="872" y="654" fill="#fff" font-size="23" font-weight="700">Higher value wins and captures both cards.</text>
<!-- bottom -->
<rect x="18" y="699" width="598" height="408" rx="18" fill="#07162d" stroke="#25ddff" stroke-width="6"/><rect x="638" y="699" width="598" height="408" rx="18" fill="#100d28" stroke="#25ddff" stroke-width="6"/><text x="42" y="756" font-size="48" font-weight="900" fill="#69eeff">4</text><text x="105" y="756" font-size="32" font-weight="900" fill="#fff">LAST STAT IS LOCKED</text><use href="#cardB" x="75" y="785" width="210" height="285"/><rect x="88" y="952" width="184" height="27" fill="#4a0c21" stroke="#ff3d62" stroke-width="4"/><text x="180" y="973" text-anchor="middle" fill="#fff" font-weight="900" font-size="18">LOCKED</text><g transform="translate(326 823)"><rect width="240" height="180" rx="14" fill="#26061a" stroke="#ff3d87" stroke-width="6"/><text x="120" y="62" text-anchor="middle" fill="#ff6a9c" font-size="27" font-weight="900">USED LAST ROUND</text><text x="120" y="130" text-anchor="middle" fill="#fff" font-size="70">⊘</text></g><text x="65" y="1082" fill="#fff" font-size="23" font-weight="700">That attribute cannot be picked next round.</text>
<text x="662" y="756" font-size="48" font-weight="900" fill="#69eeff">5</text><text x="725" y="756" font-size="32" font-weight="900" fill="#fff">1 RESERVE SWAP</text><g transform="translate(704 800)"><rect x="0" y="35" width="145" height="195" rx="15" fill="#071d3a" stroke="#26dfff" stroke-width="5"/><use href="#chimpBlue" x="14" y="42" width="116" height="116"/><rect x="245" y="35" width="145" height="195" rx="15" fill="#071d3a" stroke="#26dfff" stroke-width="5"/><use href="#chimpBlue" x="259" y="42" width="116" height="116"/><path d="M155 82c52-63 112-52 158-24" fill="none" stroke="#ffdb3d" stroke-width="10" marker-end="url(#none)"/><text x="195" y="22" text-anchor="middle" fill="#ffdc4f" font-weight="900" font-size="35">MOVE TO BACK →</text></g><text x="712" y="1082" fill="#fff" font-size="22" font-weight="700">One use per match. Next card comes forward.</text>
</g>
<rect x="18" y="1128" width="1218" height="93" rx="15" fill="#071329" stroke="#238cc3" stroke-width="3"/><text x="627" y="1191" text-anchor="middle" font-family="Courier New,monospace" font-weight="900" font-size="43" fill="#fff">CHIMPIONS <tspan fill="#ff58cc">ARENA</tspan></text><text x="55" y="1186" font-family="Courier New,monospace" font-size="18" fill="#7cefff">CLASSIC RULES. SHARP DECISIONS.</text><text x="1195" y="1186" text-anchor="end" font-family="Courier New,monospace" font-size="18" fill="#ff83dd">ONE SWAP. ONE EDGE.</text>
</svg>