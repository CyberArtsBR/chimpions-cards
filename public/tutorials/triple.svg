ENTER ROUND</text><text x="455" y="292" fill="#6af0ff" font-size="48">2</text><text x="518" y="292" font-size="28">CHOOSE 3 ATTRIBUTES</text><text x="868" y="292" fill="#6af0ff" font-size="48">3</text><text x="930" y="292" font-size="28">3 ATTRIBUTE DUELS</text></g><use href="#miniB" x="58" y="345" width="148" height="207"/><use href="#miniP" x="220" y="345" width="148" height="207"/><text x="213" y="464" text-anchor="middle" fill="#fff" stroke="#061020" stroke-width="7" paint-order="stroke" font-size="47" font-weight="900">VS</text><text x="68" y="635" fill="#fff" font-size="23" font-weight="700">Two cards face off for the round.</text><use href="#miniB" x="474" y="326" width="185" height="259"/><g transform="translate(668 335)"><rect width="120" height="220" rx="12" fill="#091a35" stroke="#2588d9" stroke-width="3"/><text x="22" y="48" fill="#66eaff" font-size="26" font-weight="900">1</text><text x="53" y="48" fill="#fff" font-size="17">PICK 1ST</text><text x="22" y="101" fill="#66eaff" font-size="26" font-weight="900">2</text><text x="53" y="101" fill="#fff" font-size="17">PICK 2ND</text><text x="22" y="154" fill="#ffd93d" font-size="26" font-weight="900">3</text><text x="53" y="154" fill="#ffd93d" font-size="17">AUTO LOCK</text><circle cx="25" cy="190" r="8" fill="#30e5ff"/><circle cx="58" cy="190" r="8" fill="#30e5ff"/><circle cx="91" cy="190" r="8" fill="#ffd93d"/></g><text x="462" y="635" fill="#fff" font-size="21" font-weight="700">Third selection locks automatically.</text><g transform="translate(876 326)"><g><rect width="328" height="84" rx="11" fill="#08223b" stroke="#23dfff" stroke-width="4"/><text x="20" y="32" fill="#9ef5ff" font-size="18" font-weight="900">1  POWER</text><use href="#blue" x="120" y="3" width="70" height="70"/><text x="197" y="55" fill="#fff" font-size="32" font-weight="900">92 VS 88</text></g><g transform="translate(0 96)"><rect width="328" height="84" rx="11" fill="#15102f" stroke="#9369ff" stroke-width="4"/><text x="20" y="32" fill="#c7b3ff" font-size="18" font-weight="900">2  AGILITY</text><text x="125" y="58" fill="#fff" font-size="32" font-weight="900">71 VS 91</text></g><g transform="translate(0 192)"><rect width="328" height="84" rx="11" fill="#25102b" stroke="#ff43c7" stroke-width="4"/><text x="20" y="32" fill="#ff9cde" font-size="18" font-weight="900">3  TECH</text><text x="125" y="58" fill="#fff" font-size="32" font-weight="900">68 VS 63</text></g></g><text x="875" y="635" fill="#fff" font-size="21" font-weight="700">The same three attributes are compared.</text><rect x="18" y="700" width="598" height="407" rx="18" fill="#06172f" stroke="#29e1ff" stroke-width="6"/><rect x="638" y="700" width="598" height="407" rx="18" fill="#100d29" stroke="#29e1ff" stroke-width="6"/><text x="42" y="758" fill="#6af0ff" font-size="48" font-weight="900">4</text><text x="105" y="758" fill="#fff" font-size="33" font-weight="900">WIN 2 OUT OF 3</text><g transform="translate(57 798)"><rect width="164" height="154" rx="12" fill="#08223b" stroke="#26dfff" stroke-width="4"/><text x="82" y="43" text-anchor="middle" fill="#fff" font-size="18">POWER</text><text x="82" y="94" text-anchor="middle" fill="#fff" font-size="30" font-weight="900">92 VS 88</text><text x="82" y="132" text-anchor="middle" fill="#55f48b" font-size="18" font-weight="900">✓ BLUE WINS</text></g><g transform="translate(230 798)"><rect width="164" height="154" rx="12" fill="#21102d" stroke="#ff45c7" stroke-width="4"/><text x="82" y="43" text-anchor="middle" fill="#fff" font-size="18">AGILITY</text><text x="82" y="94" text-anchor="middle" fill="#fff" font-size="30" font-weight="900">71 VS 91</text><text x="82" y="132" text-anchor="middle" fill="#ff72d1" font-size="18" font-weight="900">PINK WINS</text></g><g transform="translate(403 798)"><rect width="164" height="154" rx="12" fill="#08223b" stroke="#26dfff" stroke-width="4"/><text x="82" y="43" text-anchor="middle" fill="#fff" font-size="18">TECH</text><text x="82" y="94" text-anchor="middle" fill="#fff" font-size="30" font-weight="900">68 VS 63</text><text x="82" y="132" text-anchor="middle" fill="#55f48b" font-size="18" font-weight="900">✓ BLUE WINS</text></g><rect x="60" y="973" width="514" height="88" rx="12" fill="#073052" stroke="#2be2ff" stroke-width="4"/><text x="317" y="1029" text-anchor="middle" fill="url(#gold)" font-size="37" font-weight="900">🏆 BLUE WINS THE ROUND!</text><text x="662" y="758" fill="#6af0ff" font-size="48" font-weight="900">5</text><text x="725" y="758" fill="#fff" font-size="29" font-weight="900">TIED? NOBODY CAPTURES</text><g transform="translate(682 810)" font-family="Arial,sans-serif"><g><rect width="154" height="136" rx="12" fill="#0b1d32" stroke="#70dfff" stroke-width="4"/><text x="77" y="38" text-anchor="middle" fill="#fff" font-weight="900">POWER</text><text x="77" y="78" text-anchor="middle" fill="#fff" font-size="28">80 = 80</text><text x="77" y="116" text-anchor="middle" fill="#b9cde0" font-weight="900">DRAW</text></g><g transform="translate(170)"><rect width="154" height="136" rx="12" fill="#0b1d32" stroke="#70dfff" stroke-width="4"/><text x="77" y="38" text-anchor="middle" fill="#fff" font-weight="900">AGILITY</text><text x="77" y="78" text-anchor="middle" fill="#fff" font-size="28">70 = 70</text><text x="77" y="116" text-anchor="middle" fill="#b9cde0" font-weight="900">DRAW</text></g><g transform="translate(340)"><rect width="154" height="136" rx="12" fill="#0b1d32" stroke="#70dfff" stroke-width="4"/><text x="77" y="38" text-anchor="middle" fill="#fff" font-weight="900">TECH</text><text x="77" y="78" text-anchor="middle" fill="#fff" font-size="28">65 = 65</text><text x="77" y="116" text-anchor="middle" fill="#b9cde0" font-weight="900">DRAW</text></g></g><rect x="681" y="973" width="514" height="88" rx="12" fill="#2c0b27" stroke="#ff48c7" stroke-width="4"/><text x="938" y="1027" text-anchor="middle" fill="#ff86d8" font-size="28" font-weight="900">Nobody captures • turn passes.</text></g><rect x="18" y="1127" width="1