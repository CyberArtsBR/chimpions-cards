<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc"><title id="title">Team Tag 2v2 — How it works</title><desc id="desc">Five-step Team Tag 2v2 mode tutorial for Chimpions Arena.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04152c"/><stop offset=".5" stop-color="#071329"/><stop offset="1" stop-color="#220722"/></linearGradient><linearGradient id="head" x1="0" x2="1"><stop stop-color="#48e9ff"/><stop offset=".48" stop-color="#f7feff"/><stop offset=".54" stop-color="#ff85db"/><stop offset="1" stop-color="#ff2a9d"/></linearGradient><linearGradient id="gold" x1="0" x2="1"><stop stop-color="#fff27a"/><stop offset="1" stop-color="#ffa31e"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#4badff" stroke-opacity=".055"/></pattern><symbol id="blue" viewBox="0 0 110 110"><path d="M18 37 34 12l18 18 18-19 20 25" fill="#a3542e" stroke="#26dfff" stroke-width="6"/><circle cx="55" cy="65" r="32" fill="#b66a38" stroke="#26dfff" stroke-width="6"/><path d="M22 49h66v15H22z" fill="#1387ff"/><path d="M40 72h30l-5 18H45z" fill="#e9b17a"/><circle cx="44" cy="59" r="4"/><circle cx="67" cy="59" r="4"/></symbol><symbol id="pink" viewBox="0 0 110 110"><path d="M20 34 36 11l18 18 18-17 19 24" fill="#a3542e"/><circle cx="55" cy="65" r="32" fill="#b66a38" stroke="#ff43c8" stroke-width="6"/><path d="M22 47h66v17H22z" fill="#ff31ac"/><path d="M40 72h30l-5 18H45z" fill="#e9b17a"/><circle cx="44" cy="59" r="4"/><circle cx="67" cy="59" r="4"/></symbol><symbol id="miniB" viewBox="0 0 140 210"><rect x="3" y="3" width="134" height="204" rx="13" fill="#061a34" stroke="#28e0ff" stroke-width="5"/><use href="#blue" x="20" y="3" width="100" height="100"/><g font-family="Arial" font-weight="800" font-size="13" fill="#fff"><text x="10" y="124">PWR</text><text x="108" y="124">82</text><text x="10" y="148">SPD</text><text x="108" y="148">71</text><text x="10" y="172">SKL</text><text x="108" y="172">68</text><text x="10" y="196">LCK</text><text x="108" y="196">54</text></g></symbol><symbol id="miniP" viewBox="0 0 140 210"><rect x="3" y="3" width="134" height="204" rx="13" fill="#271029" stroke="#ff45c7" stroke-width="5"/><use href="#pink" x="20" y="3" width="100" height="100"/><g font-family="Arial" font-weight="800" font-size="13" fill="#fff"><text x="10" y="124">PWR</text><text x="108" y="124">88</text><text x="10" y="148">SPD</text><text x="108" y="148">60</text><text x="10" y="172">SKL</text><text x="108" y="172">83</text><text x="10" y="196">LCK</text><text x="108" y="196">62</text></g></symbol></defs><rect width="1254" height="1254" fill="url(#bg)"/><rect width="1254" height="1254" fill="url(#grid)"/><use href="#blue" x="48" y="10" width="220" height="220"/><use href="#pink" x="986" y="10" width="220" height="220"/><text x="627" y="122" text-anchor="middle" font-family="Courier New,monospace" font-weight="900" font-size="101" fill="url(#head)" stroke="#031020" stroke-width="8" paint-order="stroke">TEAM TAG 2v2</text><rect x="416" y="146" width="422" height="66" rx="10" fill="#091831" stroke="#26dcff" stroke-width="4"/><text x="627" y="192" text-anchor="middle" font-family="Courier New,monospace" font-size="38" font-weight="900" fill="#fff">HOW IT WORKS</text><g font-family="Courier New,monospace"><rect x="18" y="235" width="392" height="424" rx="18" fill="#06172f" stroke="#29e1ff" stroke-width="6"/><rect x="431" y="235" width="392" height="424" rx="18" fill="#07172f" stroke="#29e1ff" stroke-width="6"/><rect x="844" y="235" width="392" height="424" rx="18" fill="#0d132e" stroke="#29e1ff" stroke-width="6"/><g font-weight="900" fill="#fff"><text x="42" y="292" fill="#6af0ff" font-size="48">1</text><text x="105" y="292" font-size="31">20 CARDS EACH</text><text x="455" y="292" fill="#6af0ff" font-size="48">2</text><text x="518" y="292" font-size="27">2 CARDS PER SIDE ENTER</text><text x="868" y="292" fill="#6af0ff" font-size="48">3</text><text x="930" y="292" font-size="29">CHOOSE 1 ATTRIBUTE</text></g><g transform="translate(78 339)"><g transform="rotate(-10 100 100)"><rect x="0" y="0" width="150" height="205" rx="14" fill="#0877b8" stroke="#72efff" stroke-width="6"/><text x="75" y="118" text-anchor="middle" font-size="75">♛</text></g><g transform="translate(140) rotate(10 100 100)"><rect x="0" y="0" width="150" height="205" rx="14" fill="#aa1477" stroke="#ff79d5" stroke-width="6"/><text x="75" y="118" text-anchor="middle" font-size="75">♛</text></g><circle cx="82" cy="218" r="48" fill="#0c2d4d" stroke="#29dfff" stroke-width="6"/><text x="82" y="234" text-anchor="middle" fill="#fff" font-size="46" font-weight="900">20</text><circle cx="225" cy="218" r="48" fill="#45102f" stroke="#ff42c5" stroke-width="6"/><text x="225" y="234" text-anchor="middle" fill="#fff" font-size="46" font-weight="900">20</text></g><text x="82" y="630" fill="#fff" font-size="23" font-weight="700">Each player starts with 20 cards.</text><use href="#miniB" x="451" y="345" width="128" height="192"/><use href="#miniB" x="574" y="345" width="128" height="192"/><use href="#miniP" x="704" y="345" width="128" height="192"/><use href="#miniP" x="827" y="345" width="128" height="192"/><text x="628" y="463" text-anchor="middle" fill="#fff" stroke="#061020" stroke-width="7" paint-order="stroke" font-size="48" font-weight="900">VS</text><text x="464" y="630" fill="#fff" font-size="22" font-weight="700">Two cards are dealt to each side every round.</text><use href="#miniB" x="864" y="330" width="155" height="232"/><use href="#miniB" x="1024" y="330" width="155" height="232"/><rect x="875" y="443" width="133" height="26" fill="#0a2b3b" stroke="#ffe63d" stroke-width="4"/><rect x="1035" y="443" width="133" height="26" fill="#0a2b3b" stroke="#ffe63d" stroke-width="4"/><path d="M840 456h27" stroke="#ffe63d" stroke-width="10"/><text x="876" y="630" fill="#fff" font-size="22" font-weight="700">One pick applies to BOTH active cards.</text><rect x="18" y="681" width="598" height="426" rx="18" fill="#06172f" stroke="#29e1ff" stroke-width="6"/><rect x="638" y="681" width="598" height="426" rx="18" fill="#100d29" stroke="#29e1ff" stroke-width="6"/><text x="42" y="740" fill="#6af0ff" font-size="48" font-weight="900">4</text><text x="105" y="740" fill="#fff" font-size="31" font-weight="900">OWN THE TOP 2 TO WIN</text><g transform="translate(55 780)"><use href="#miniB" x="0" y="0" width="125" height="188"/><use href="#miniB" x="132" y="0" width="125" height="188"/><use href="#miniP" x="277" y="0" width="125" height="188"/><use href="#miniP" x="409" y="0" width="125" height="188"/><text x="62" y="-12" text-anchor="middle" fill="#ffe43d" font-size="24" font-weight="900">♛ #1</text><text x="194" y="-12" text-anchor="middle" fill="#ffe43d" font-size="24" font-weight="900">♛ #2</text><text x="339" y="-12" text-anchor="middle" fill="#aaa" font-size="21">#3</text><text x="471" y="-12" text-anchor="middle" fill="#aaa" font-size="21">#4</text></g><rect x="58" y="984" width="520" height="79" rx="12" fill="#06304f" stroke="#2ae1ff" stroke-width="4"/><text x="318" y="1025" text-anchor="middle" fill="url(#gold)" font-size="28" font-weight="900">🏆 BLUE CAPTURES 2 ENEMY CARDS</text><text x="318" y="1051" text-anchor="middle" fill="#8df3ff" font-size="19">Winner chooses the next attribute again.</text><text x="662" y="740" fill="#6af0ff" font-size="48" font-weight="900">5</text><text x="725" y="740" fill="#fff" font-size="31" font-weight="900">SPLIT TOP 2 = DRAW</text><g transform="translate(675 780)"><use href="#miniB" x="0" y="0" width="125" height="188"/><use href="#miniP" x="132" y="0" width="125" height="188"/><use href="#miniB" x="277" y="0" width="125" height="188"/><use href="#miniP" x="409" y="0" width="125" height="188"/><text x="62" y="-12" text-anchor="middle" fill="#ffe43d" font-size="24" font-weight="900">♛ #1</text><text x="194" y="-12" text-anchor="middle" fill="#ffe43d" font-size="24" font-weight="900">♛ #2</text><text x="339" y="-12" text-anchor="middle" fill="#aaa" font-size="21">#3</text><text x="471" y="-12" text-anchor="middle" fill="#aaa" font-size="21">#4</text></g><rect x="679" y="984" width="520" height="79" rx="12" fill="#32102e" stroke="#ff47c6" stroke-width="4"/><text x="939" y="1025" text-anchor="middle" fill="#ff84d7" font-size="29" font-weight="900">🤝 NOBODY CAPTURES</text><text x="939" y="1052" text-anchor="middle" fill="#ffc2eb" font-size="19">Turn passes to the opponent.</text></g><rect x="18" y="1127" width="1218" height="94" rx="15" fill="#071329" stroke="#318bc2" stroke-width="3"/><text x="627" y="1190" text-anchor="middle" font-family="Courier New,monospace" font-weight="900" font-size="43" fill="#fff">CHIMPIONS <tspan fill="#ff59c9">ARENA</tspan></text><text x="50" y="1183" font-family="Courier New,monospace" font-size="17" fill="#74ecff">WINNER TAKES 2 ENEMY CARDS.</text><text x="1204" y="1183" text-anchor="end" font-family="Courier New,monospace" font-size="17" fill="#ff84d5">DRAW = NO CAPTURE.</text></svg>