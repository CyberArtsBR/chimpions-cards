    <path d="M-130-64a145 145 0 0 1 47-55M83-119a145 145 0 0 1 47 55M130 64a145 145 0 0 1-47 55M-83 119a145 145 0 0 1-47-55" stroke="url(#neon)" stroke-width="9"/>
    <path d="M-220 0h100M120 0h100" stroke="url(#neon)" stroke-width="6"/>
    <path d="m-172 0 18-18 18 18-18 18Zm344 0 18-18 18 18-18 18Z" stroke="url(#neon)" stroke-width="6"/>
