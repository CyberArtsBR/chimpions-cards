<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" width="1024" height="1536" role="img" aria-label="The Chimpions Arena opponent card">
<defs>
  <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#51647d"/><stop offset=".18" stop-color="#111b2d"/><stop offset=".52" stop-color="#050a14"/><stop offset=".82" stop-color="#1a2940"/><stop offset="1" stop-color="#6f8198"/></linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#06c9ff"/><stop offset=".47" stop-color="#f4f6ff"/><stop offset=".55" stop-color="#bf7aff"/><stop offset="1" stop-color="#ff20df"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#13164d"/><stop offset=".38" stop-color="#080d32"/><stop offset="1" stop-color="#030817"/></linearGradient>
  <radialGradient id="centerGlow"><stop stop-color="#8d5cff" stop-opacity=".55"/><stop offset=".48" stop-color="#4029c9" stop-opacity=".12"/><stop offset="1" stop-color="#050817" stop-opacity="0"/></radialGradient>
  <filter id="cyanGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="inner"><rect x="58" y="52" width="908" height="1432" rx="42"/></clipPath>
  <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse"><path d="M70 0H0V70" fill="none" stroke="#7aa8ff" stroke-opacity=".09" stroke-width="2"/></pattern>
</defs>

<!-- premium gunmetal shell -->
<rect x="6" y="6" width="1012" height="1524" rx="70" fill="#02050c" stroke="#02040a" stroke-width="12"/>
<rect x="18" y="18" width="988" height="1500" rx="62" fill="url(#frame)" stroke="#a9b9cc" stroke-width="3"/>
<rect x="36" y="36" width="952" height="1464" rx="52" fill="#050a14" stroke="#111b2d" stroke-width="12"/>
<path d="M70 55H458l54 48 54-48h388l30 32v1362l-30 32H566l-54-48-54 48H70l-30-32V87Z" fill="#020611" stroke="url(#neon)" stroke-width="9"/>
<path d="M72 74H463l49 45 49-45h391l18 20v1348l-18 20H561l-49-45-49 45H72l-18-20V94Z" fill="#050817" stroke="#7385b8" stroke-opacity=".45" stroke-width="2"/>

<g clip-path="url(#inner)">
