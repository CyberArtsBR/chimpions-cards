  <!-- opponent text -->
  <g text-anchor="middle" filter="url(#softGlow)">
    <text x="512" y="1075" font-family="'Courier New',monospace" font-size="91" font-weight="900" fill="url(#neon)" stroke="#f7fbff" stroke-opacity=".24" stroke-width="2" letter-spacing="-5">OPPONENT CARD</text>
